apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: chainlearn-staging

resources:
  - ../../base

namePrefix: staging-
commonLabels:
  environment: staging

patches:
  # API - 2 replicas for staging
  - target:
      kind: Deployment
      name: chainlearn-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi

  # AI - 1 replica for staging
  - target:
      kind: Deployment
      name: chainlearn-ai
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi

  # Indexer - 1 replica for staging
  - target:
      kind: Deployment
      name: chainlearn-indexer
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

  # Frontend - 2 replicas for staging
  - target:
      kind: Deployment
      name: chainlearn-frontend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2

  # ConfigMap overrides for staging
  - target:
      kind: ConfigMap
      name: chainlearn-api-config
    patch: |
      - op: replace
        path: /data/NODE_ENV
        value: "staging"
      - op: replace
        path: /data/LOG_LEVEL
        value: "info"
      - op: replace
        path: /data/STELLAR_NETWORK
        value: "testnet"

  - target:
      kind: ConfigMap
      name: chainlearn-ai-config
    patch: |
      - op: replace
        path: /data/APP_ENV
        value: "staging"
      - op: replace
        path: /data/LOG_LEVEL
        value: "info"

  - target:
      kind: ConfigMap
      name: chainlearn-indexer-config
    patch: |
      - op: replace
        path: /data/NODE_ENV
        value: "staging"
      - op: replace
        path: /data/LOG_LEVEL
        value: "info"
      - op: replace
        path: /data/STELLAR_NETWORK
        value: "testnet"

  - target:
      kind: ConfigMap
      name: chainlearn-frontend-config
    patch: |
      - op: replace
        path: /data/NODE_ENV
        value: "staging"
      - op: replace
        path: /data/NEXT_PUBLIC_STELLAR_NETWORK
        value: "testnet"

  # Ingress - staging domain
  - target:
      kind: Ingress
      name: chainlearn-ingress
    patch: |
      - op: replace
        path: /spec/tls/0/hosts
        value:
          - staging.chainlearn.io
          - api-staging.chainlearn.io
      - op: replace
        path: /spec/tls/0/secretName
        value: chainlearn-staging-tls
      - op: replace
        path: /spec/rules/0/host
        value: staging.chainlearn.io
      - op: replace
        path: /spec/rules/1/host
        value: api-staging.chainlearn.io

configMapGenerator:
  - name: chainlearn-staging-overrides
    literals:
      - ENABLE_MOCK_AI=false
