apiVersion: v1
kind: ConfigMap
metadata:
  name: chainlearn-frontend-config
  namespace: chainlearn
  labels:
    app.kubernetes.io/name: chainlearn-frontend
    app.kubernetes.io/part-of: chainlearn
data:
  NODE_ENV: "production"
  PORT: "3000"
  NEXT_PUBLIC_STELLAR_NETWORK: "testnet"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chainlearn-frontend
  namespace: chainlearn
  labels:
    app.kubernetes.io/name: chainlearn-frontend
    app.kubernetes.io/part-of: chainlearn
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chainlearn-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chainlearn-frontend
        app.kubernetes.io/part-of: chainlearn
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: chainlearn-frontend
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          image: chainlearn-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: chainlearn-frontend-config
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: chainlearn-frontend-config
                  key: NEXT_PUBLIC_API_URL
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: chainlearn-frontend
---
apiVersion: v1
kind: Service
metadata:
  name: chainlearn-frontend
  namespace: chainlearn
  labels:
    app.kubernetes.io/name: chainlearn-frontend
    app.kubernetes.io/part-of: chainlearn
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: chainlearn-frontend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chainlearn-frontend
  namespace: chainlearn
  labels:
    app.kubernetes.io/name: chainlearn-frontend
    app.kubernetes.io/part-of: chainlearn
