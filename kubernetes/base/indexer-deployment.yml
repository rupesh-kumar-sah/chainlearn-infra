apiVersion: v1
kind: ConfigMap
metadata:
  name: chainlearn-indexer-config
  namespace: chainlearn
  labels:
    app.kubernetes.io/name: chainlearn-indexer
    app.kubernetes.io/part-of: chainlearn
data:
  NODE_ENV: "production"
  PORT: "3002"
  STELLAR_NETWORK: "testnet"
  STELLAR_HORIZON_URL: "https://horizon-testnet.stellar.org"
  LOG_LEVEL: "info"
  INDEXER_BATCH_SIZE: "100"
  INDEXER_POLL_INTERVAL_MS: "5000"
  START_LEDGER: "latest"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chainlearn-indexer
  namespace: chainlearn
  labels:
    app.kubernetes.io/name: chainlearn-indexer
    app.kubernetes.io/part-of: chainlearn
    app.kubernetes.io/component: indexer
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chainlearn-indexer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chainlearn-indexer
        app.kubernetes.io/part-of: chainlearn
        app.kubernetes.io/component: indexer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3002"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: chainlearn-indexer
      terminationGracePeriodSeconds: 60
      containers:
        - name: indexer
          image: chainlearn-indexer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
              protocol: TCP
          envFrom:
            - configMapRef:
                name: chainlearn-indexer-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chainlearn-secrets
                  key: database-url
            - name: STELLAR_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: chainlearn-secrets
                  key: stellar-secret-key
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: chainlearn-indexer
---
apiVersion: v1
kind: Service
metadata:
  name: chainlearn-indexer
  namespace: chainlearn
  labels:
    app.kubernetes.io/name: chainlearn-indexer
    app.kubernetes.io/part-of: chainlearn
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3002
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: chainlearn-indexer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chainlearn-indexer
  namespace: chainlearn
  labels:
    app.kubernetes.io/name: chainlearn-indexer
    app.kubernetes.io/part-of: chainlearn
