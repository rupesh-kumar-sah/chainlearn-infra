apiVersion: v1
kind: ConfigMap
metadata:
  name: chainlearn-api-config
  namespace: chainlearn
  labels:
    app.kubernetes.io/name: chainlearn-api
    app.kubernetes.io/part-of: chainlearn
data:
  NODE_ENV: "production"
  PORT: "3001"
  STELLAR_NETWORK: "testnet"
  STELLAR_HORIZON_URL: "https://horizon-testnet.stellar.org"
  LOG_LEVEL: "info"
  CORS_ORIGINS: "*"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chainlearn-api
  namespace: chainlearn
  labels:
    app.kubernetes.io/name: chainlearn-api
    app.kubernetes.io/part-of: chainlearn
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chainlearn-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chainlearn-api
        app.kubernetes.io/part-of: chainlearn
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: chainlearn-api
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: chainlearn-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: chainlearn-api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chainlearn-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: chainlearn-secrets
                  key: redis-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chainlearn-secrets
                  key: jwt-secret
            - name: STELLAR_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: chainlearn-secrets
                  key: stellar-secret-key
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: chainlearn-api
---
apiVersion: v1
kind: Service
metadata:
  name: chainlearn-api
  namespace: chainlearn
  labels:
    app.kubernetes.io/name: chainlearn-api
    app.kubernetes.io/part-of: chainlearn
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3001
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: chainlearn-api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chainlearn-api
  namespace: chainlearn
  labels:
    app.kubernetes.io/name: chainlearn-api
    app.kubernetes.io/part-of: chainlearn
