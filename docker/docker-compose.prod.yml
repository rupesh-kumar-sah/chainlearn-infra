# =============================================================================
# ChainLearn Production-like Docker Compose
# For local testing of production builds
# =============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f
#   docker compose -f docker-compose.prod.yml down -v
# =============================================================================

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database (Production-like)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: chainlearn-postgres-prod
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: chainlearn
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chainlearn_prod_password}
      POSTGRES_DB: chainlearn
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=128MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainlearn -d chainlearn"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - chainlearn

  # ---------------------------------------------------------------------------
  # Redis Cache (Production-like)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: chainlearn-redis-prod
    restart: always
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --save 300 10
      --requirepass ${REDIS_PASSWORD:-chainlearn_redis_password}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-chainlearn_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - chainlearn

  # ---------------------------------------------------------------------------
  # ChainLearn API Service (Production Build)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
      target: production
    image: chainlearn-api:latest
    container_name: chainlearn-api-prod
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://chainlearn:${DB_PASSWORD:-chainlearn_prod_password}@postgres:5432/chainlearn
      REDIS_URL: redis://:${REDIS_PASSWORD:-chainlearn_redis_password}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      STELLAR_NETWORK: ${STELLAR_NETWORK:-testnet}
      STELLAR_HORIZON_URL: ${STELLAR_HORIZON_URL:-https://horizon-testnet.stellar.org}
      LOG_LEVEL: info
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - chainlearn

  # ---------------------------------------------------------------------------
  # ChainLearn AI Service (Production Build)
  # ---------------------------------------------------------------------------
  ai:
    build:
      context: ../../services/ai
      dockerfile: Dockerfile
      target: production
    image: chainlearn-ai:latest
    container_name: chainlearn-ai-prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      PORT: 8000
      REDIS_URL: redis://:${REDIS_PASSWORD:-chainlearn_redis_password}@redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STELLAR_NETWORK: ${STELLAR_NETWORK:-testnet}
      LOG_LEVEL: info
      MODEL_CACHE_DIR: /models
      MAX_CONCURRENT_REQUESTS: 20
    volumes:
      - ai_models:/models
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 1G
    networks:
      - chainlearn

  # ---------------------------------------------------------------------------
  # ChainLearn Indexer Service (Production Build)
  # ---------------------------------------------------------------------------
  indexer:
    build:
      context: ../../services/indexer
      dockerfile: Dockerfile
      target: production
    image: chainlearn-indexer:latest
    container_name: chainlearn-indexer-prod
    restart: always
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://chainlearn:${DB_PASSWORD:-chainlearn_prod_password}@postgres:5432/chainlearn
      STELLAR_NETWORK: ${STELLAR_NETWORK:-testnet}
      STELLAR_HORIZON_URL: ${STELLAR_HORIZON_URL:-https://horizon-testnet.stellar.org}
      LOG_LEVEL: info
      INDEXER_BATCH_SIZE: 100
      INDEXER_POLL_INTERVAL_MS: 5000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - chainlearn

  # ---------------------------------------------------------------------------
  # ChainLearn Frontend (Production Build)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../../services/frontend
      dockerfile: Dockerfile
      target: production
    image: chainlearn-frontend:latest
    container_name: chainlearn-frontend-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:3001}
      NEXT_PUBLIC_STELLAR_NETWORK: ${STELLAR_NETWORK:-testnet}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - chainlearn

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: chainlearn-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    networks:
      - chainlearn

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ai_models:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  chainlearn:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
