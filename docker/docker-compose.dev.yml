# =============================================================================
# ChainLearn Development Docker Compose
# Full local stack for development
# =============================================================================
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml logs -f api
#   docker compose -f docker-compose.dev.yml down -v
# =============================================================================

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: chainlearn-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: chainlearn
      POSTGRES_PASSWORD: chainlearn_dev_password
      POSTGRES_DB: chainlearn
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainlearn -d chainlearn"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chainlearn

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: chainlearn-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chainlearn

  # ---------------------------------------------------------------------------
  # ChainLearn API Service
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
      target: development
    container_name: chainlearn-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://chainlearn:chainlearn_dev_password@postgres:5432/chainlearn
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-do-not-use-in-production
      STELLAR_NETWORK: testnet
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_SECRET_KEY: ${STELLAR_SECRET_KEY:-}
      LOG_LEVEL: debug
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - ../../services/api:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - chainlearn

  # ---------------------------------------------------------------------------
  # ChainLearn AI Service
  # ---------------------------------------------------------------------------
  ai:
    build:
      context: ../../services/ai
      dockerfile: Dockerfile
      target: development
    container_name: chainlearn-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      PORT: 8000
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STELLAR_NETWORK: testnet
      STELLAR_SECRET_KEY: ${STELLAR_SECRET_KEY:-}
      LOG_LEVEL: debug
      MODEL_CACHE_DIR: /models
    volumes:
      - ../../services/ai:/app
      - ai_models:/models
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    networks:
      - chainlearn

  # ---------------------------------------------------------------------------
  # ChainLearn Indexer Service
  # ---------------------------------------------------------------------------
  indexer:
    build:
      context: ../../services/indexer
      dockerfile: Dockerfile
      target: development
    container_name: chainlearn-indexer
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgresql://chainlearn:chainlearn_dev_password@postgres:5432/chainlearn
      STELLAR_NETWORK: testnet
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_SECRET_KEY: ${STELLAR_SECRET_KEY:-}
      LOG_LEVEL: debug
      INDEXER_BATCH_SIZE: 50
      INDEXER_POLL_INTERVAL_MS: 10000
      START_LEDGER: latest
    volumes:
      - ../../services/indexer:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - chainlearn

  # ---------------------------------------------------------------------------
  # ChainLearn Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../../services/frontend
      dockerfile: Dockerfile
      target: development
    container_name: chainlearn-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    volumes:
      - ../../services/frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - chainlearn

  # ---------------------------------------------------------------------------
  # Mailhog (Email Testing)
  # ---------------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: chainlearn-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - chainlearn

  # ---------------------------------------------------------------------------
  # Adminer (Database Management)
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: chainlearn-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chainlearn

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ai_models:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  chainlearn:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
