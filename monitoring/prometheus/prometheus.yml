# =============================================================================
# ChainLearn Prometheus Configuration
# =============================================================================
# This configuration is used for local development or self-managed Prometheus.
# For AWS deployments, use Amazon Managed Service for Prometheus (AMP).
# =============================================================================

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

  # External labels for remote write and federation
  external_labels:
    cluster: chainlearn
    environment: "${ENVIRONMENT:-dev}"

# =============================================================================
# Alerting Rules
# =============================================================================
rule_files:
  - "rules/*.yml"

# =============================================================================
# Alert Manager Configuration
# =============================================================================
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# =============================================================================
# Remote Write (for Amazon Managed Prometheus)
# =============================================================================
remote_write:
  - url: "${PROMETHEUS_REMOTE_WRITE_URL:-}"
    queue_config:
      max_samples_per_send: 1000
      batch_send_deadline: 5s
      max_shards: 200
    sigv4:
      region: "${AWS_REGION:-us-east-1}"

# =============================================================================
# Scrape Configurations
# =============================================================================
scrape_configs:
  # ---------------------------------------------------------------------------
  # Prometheus self-monitoring
  # ---------------------------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus

  # ---------------------------------------------------------------------------
  # ChainLearn API Service
  # ---------------------------------------------------------------------------
  - job_name: "chainlearn-api"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["chainlearn-api:3001"]
        labels:
          service: api
          app: chainlearn
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # For Kubernetes service discovery
  - job_name: "chainlearn-api-k8s"
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - chainlearn
            - chainlearn-dev
            - chainlearn-staging
            - chainlearn-prod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: chainlearn-api
        action: keep
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: (.+)
        target_label: __address__
        replacement: ${1}:${1}
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # ---------------------------------------------------------------------------
  # ChainLearn AI Service
  # ---------------------------------------------------------------------------
  - job_name: "chainlearn-ai"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["chainlearn-ai:8000"]
        labels:
          service: ai
          app: chainlearn
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # For Kubernetes service discovery
  - job_name: "chainlearn-ai-k8s"
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - chainlearn
            - chainlearn-dev
            - chainlearn-staging
            - chainlearn-prod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: chainlearn-ai
        action: keep
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: (.+)
        target_label: __address__
        replacement: ${1}:${1}
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # ---------------------------------------------------------------------------
  # ChainLearn Indexer Service
  # ---------------------------------------------------------------------------
  - job_name: "chainlearn-indexer"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["chainlearn-indexer:3002"]
        labels:
          service: indexer
          app: chainlearn
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # For Kubernetes service discovery
  - job_name: "chainlearn-indexer-k8s"
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - chainlearn
            - chainlearn-dev
            - chainlearn-staging
            - chainlearn-prod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: chainlearn-indexer
        action: keep
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: (.+)
        target_label: __address__
        replacement: ${1}:${1}
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # ---------------------------------------------------------------------------
  # Node Exporter (host metrics)
  # ---------------------------------------------------------------------------
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node-exporter

  # ---------------------------------------------------------------------------
  # Redis Exporter
  # ---------------------------------------------------------------------------
  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis

  # ---------------------------------------------------------------------------
  # PostgreSQL Exporter
  # ---------------------------------------------------------------------------
  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  # ---------------------------------------------------------------------------
  # Nginx Exporter
  # ---------------------------------------------------------------------------
  - job_name: "nginx-exporter"
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          service: nginx

  # ---------------------------------------------------------------------------
  # Blackbox Exporter (endpoint monitoring)
  # ---------------------------------------------------------------------------
  - job_name: "blackbox-http"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://chainlearn.io
          - https://api.chainlearn.io/health
          - http://chainlearn-frontend:3000
          - http://chainlearn-api:3001/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
